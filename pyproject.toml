[project]
name = "lk-logger"
version = "6.0.7"
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
description = "Python print with source map and varnames."
dynamic = ["dependencies"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"

[project.urls]
homepage = "https://github.com/likianta/lk-logger"

[tool.poetry.dependencies]
python = "^3.8"
rich = ">=13.9.0"
# rich = "^14.0.0"

# --- svg util ---
# html2image = { version = "^2.0.4", optional = true }
# pycairo = { version = "^1.27.0", python = "^3.9", optional = true }
# selenium = { version = "^4.27.1", optional = true }
svg-ultralight = { version = "^0.34.0", python = "^3.9", optional = true }

[project.optional-dependencies]
ext = ["svg-ultralight"]

[tool.poetry.group.dev.dependencies]
airmise = { version = "^1.0.0", source = "likianta" }
argsense = { version = "^1.1.1a0", source = "likianta" }
# html2image = "^2.0.4"
ipython = { version = "^9.4.0", python = "^3.12" }
lk-utils = { version = "^3.3.0", source = "likianta" }  # misc/compose_terminal_theme.py
# nuitka = { version = "^2.5.6", python = "==3.12" }
rich = "^14.0.0"
svg-ultralight = { version = "^0.34.0", python = "^3.12" }

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "likianta"
url = "http://localhost:2131/"
priority = "supplemental"

[build-system]
requires = ["poetry"]
build-backend = "poetry.core.masonry.api"
