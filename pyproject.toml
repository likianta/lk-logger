[project]
name = "lk-logger"
version = "6.1.0a3"
description = "Python print with source map and varnames."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=14.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    "ipython>=9.15.0; python_version >= '3.12'",
    "lk-utils>=3.7.0a6; python_version >= '3.9'",
    "rich>=15.0.0; python_version >= '3.9'",
    "svg-ultralight>=0.34.0; python_version >= '3.12'",
]

[project.optional-dependencies]
ext = [
    # "html2image>=2.0.4",
    # "pycairo>=1.27.0",
    # "selenium>=4.27.1",
    "svg-ultralight>=0.34.0; python_version >= '3.9'",
]

# [project.scripts]
# ...

[project.urls]
homepage = "https://github.com/likianta/lk-logger"

[tool.hatch.build.targets.wheel]
packages = ["lk_logger"]

[tool.ruff]
ignore = ["E701"]
line-length = 80

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
force-single-line = true
no-sections = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2191/"
# explicit = true

[tool.uv.sources]
lk-utils = { index = "likianta" }
